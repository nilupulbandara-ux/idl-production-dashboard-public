name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: status only
        run: |
          U=https://idl-production-dashboard.nilupulbandara.chatgpt.site
          curl -s -o /dev/null -w "feed %{http_code}\n" -A "Mozilla/5.0" "$U/api/feed"
          curl -s -o /dev/null -w "perf %{http_code}\n" -A "Mozilla/5.0" "$U/api/performance"
          curl -s https://api.ipify.org; echo
